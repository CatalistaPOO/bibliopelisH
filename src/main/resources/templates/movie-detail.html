<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Detalle Película</title>
    <link rel="stylesheet" th:href="@{/style-detail.css}">
</head>
<body>

<div class="detail-container">
        <div class="header">
            <a class="btn" th:href="@{/}">Volver a atras</a>
        </div>
    <h1 th:text="${pelicula.titulo}">Título</h1>

    <!-- Reproductor de YouTube -->
    <div class="video-responsive" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
        <iframe
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
                th:src="${'https://www.youtube.com/embed/' + pelicula.urlVideo}"
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
        </iframe>
    </div>

    <div class="actions" style="margin-top: 20px;">
        <p><strong>Titúlo: </strong><span th:text="${pelicula.getTitulo()}"></span></p>
        <p><strong>Géneros:</strong> <span th:each="g : ${pelicula.generos}" th:text="${g.genero} + ' ' "></span></p>
        <p><strong>Año: </strong> <span th:text="${pelicula.getAnyo()}"></span></p>

    </div>
</div>

</body>
</html>
